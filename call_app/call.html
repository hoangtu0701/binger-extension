<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binger Call</title>

    <!-- Firebase SDKs (CSP-safe local versions) -->
    <script src="firebase/firebase-app.js"></script>
    <script src="firebase/firebase-auth.js"></script>
    <script src="firebase/firebase-database.js"></script>

    <!-- Bundled JS (includes CSS) -->
    <script src="call.js"></script>
  </head>

  <body>
    <div class="call-stage">
      <div class="feed feed-local">
        <video id="localVideo" autoplay muted></video>
        <div class="feed-placeholder" data-initial=""></div>
        <div class="feed-mic" data-muted="true"></div>
      </div>

      <div class="feed feed-remote" data-slot="1">
        <video id="remoteVideo" autoplay></video>
        <div class="feed-placeholder" data-initial=""></div>
        <div class="feed-mic" data-muted="true"></div>
      </div>

      <div class="feed feed-remote" data-slot="2" hidden>
        <video id="remoteVideo2" autoplay></video>
        <div class="feed-placeholder" data-initial=""></div>
        <div class="feed-mic" data-muted="true"></div>
      </div>

      <div class="controls">
        <button id="btnToggleMic" class="ctrl-btn is-off" disabled>
          <svg class="ctrl-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ctrl-glyph" d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
            <path class="ctrl-glyph" d="M5 11a7 7 0 0 0 14 0"/>
            <path class="ctrl-glyph" d="M12 18v3"/>
            <line class="ctrl-slash" x1="4" y1="20" x2="20" y2="4"/>
          </svg>
          <span class="ctrl-tip"><span class="ctrl-tip-title">Mic</span></span>
        </button>

        <button id="btnToggleCam" class="ctrl-btn is-off" disabled>
          <svg class="ctrl-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="ctrl-glyph" x="3" y="6" width="12" height="12" rx="2"/>
            <path class="ctrl-glyph" d="M15 10.5l6-3.5v10l-6-3.5z"/>
            <line class="ctrl-slash" x1="4" y1="20" x2="20" y2="4"/>
          </svg>
          <span class="ctrl-tip"><span class="ctrl-tip-title">Cam</span></span>
        </button>

        <button id="btnToggleAudio" class="ctrl-btn" disabled>
          <svg class="ctrl-icon ctrl-icon-speaker" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ctrl-glyph" d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path class="ctrl-glyph ctrl-wave-1" d="M16.5 8.5a5 5 0 0 1 0 7"/>
            <path class="ctrl-glyph ctrl-wave-2" d="M19 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
          <svg class="ctrl-icon ctrl-icon-headphones" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ctrl-glyph" d="M4 15v-3a8 8 0 0 1 16 0v3"/>
            <rect class="ctrl-glyph" x="2" y="13.5" width="4.5" height="7" rx="2.25"/>
            <rect class="ctrl-glyph" x="17.5" y="13.5" width="4.5" height="7" rx="2.25"/>
          </svg>
          <span class="ctrl-tip">
            <span class="ctrl-tip-title audio-tooltip-title"></span>
            <span class="ctrl-tip-desc audio-tooltip-desc"></span>
          </span>
        </button>
      </div>
    </div>
  </body>
</html>
